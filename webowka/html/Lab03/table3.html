<!DOCTYPE html>
<html lang="pl">
<head>
 <meta charset="UTF-8">
<title>Table Gallery</title>
<style>
h1 {
    font-weight: 200;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
 h2 {
    font-weight: 300;
    font-style: italic;
    color: #888;
    margin-bottom: 40px;
  }
.memories {
    position: fixed;
    left: 10%;
    right: 10%;
    margin-top: 60px;
    display: flex;
    justify-content: space-between;
    border-top: 1px solid #eee;
    padding-top: 20px;
  }
.memories a {
    text-decoration: none;
    color: #000;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    transition: opacity 0.3s;
  }
table {
  margin: 20px auto; /* 20px auto bedzie wysrodkowac */
  border: 2px solid gray;      /* 1px solid gray;  3px dotted #F00; obramowanie calej tabeli } */
  border-collapse: collapse; /* { border-collapse: collapse; włączenie nakładania się na siebie obramowania } */
  caption-side: top; /* {  bottom; umiejscowanie tytułu tabeli } */
  width: 60%;

}
thead th {
    background-color: green; /* Zielone tło */
    color: white;            /* Biały kolor tekstu */
}
tbody{
  padding: 10px 0px;
}
th, td {
    border: 1px solid gray; /* 1px solid green;  3px dashed #F00; obramowanie komórki */
    padding: 10px;   /*    odstęp obramowania komórki od jej zawartości  */
    text-align: center; /*text-align: left; vertical-align: top; wyrównanie zawartości komórki w poziomie (left, center, right, justify) / pionie (top, middle, bottom). */
  }
td {
    height: 50px;
}
td:nth-child(1) { text-align: left; width: 30px; } td:nth-child(2) { text-align: left; 
width: 250px; } td:nth-child(3) { text-align: left; width: 75px; } /* Ustalanie stylów CSS do każdego n-tego elementu lub do elementów wybranego typu – służą do 
tego m. in. pseudoklasy :nth-child(wzór), :nth-of-type(wzór). 
Można też ustalać style tylko dla ostatnich elementów ze wzorca. Służą do tego pseudoklasy 
:nth-last-child(wzór), :nth-last-of-type(wzór). */


tr:nth-child(1) td:nth-child(2) { horizontal-align: left; vertical-align: top;  text-align: left; }

tr:nth-child(2) td:nth-child(2) {  horizontal-align: center; vertical-align: middle; text-align: center; }


tr:nth-child(3) td:nth-child(2) {  horizontal-align: right; vertical-align: bottom;  text-align: right; }

tr:nth-child(3){
  border: 2px solid gray;
}
td:nth-child(3) {
    border-left: 2px solid gray; 
}

</style> 
</head>
<body>
<h1>HTML Table Gallery</h1>
<h2>Tablica 3</h2>
<table > 
  <caption>Przykładowa Tabela</caption> 
  <thead> 
    <tr> 
      <th>Nagłówek 1</th> 
      <th>Nagłówek 2</th> 
      <th>Nagłówek 3</th> 
    </tr> 
  </thead> 
  <tbody> 
    <tr> 
      <td>kol 0 wiersz 1</td> 
      <td>w poziomie left, w pionie top</td> 
      <td>kol 2 wiersz 1</td> 
    </tr> 
    <tr> 
      <td>kol 0 wiersz 2</td> 
      <td>w poziomie center, w pionie middle</td> 
      <td>kol 2 wiersz 2</td> 
    </tr>
    <tr></tr>
      <td>kol 0 wiersz 3</td> 
      <td>w poziomie right, w pionie bottom</td> 
      <td>kol 2 wiersz 3</td> 
    </tr>
  </tbody>
  </table>

<div class="memories">
    <a href="table2.html">Previous</a>
    <a href="table4.html">Next</a>
</div>
</body>
