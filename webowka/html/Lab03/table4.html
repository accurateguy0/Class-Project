<!DOCTYPE html>
<html lang="pl">
<head>
 <meta charset="UTF-8">
<title>Table Gallery</title>
<style>
h1 {
    font-weight: 200;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
 h2 {
    font-weight: 300;
    font-style: italic;
    color: #888;
    margin-bottom: 40px;
  }
.memories {
    position: fixed;
    left: 10%;
    right: 10%;
    margin-top: 60px;
    display: flex;
    justify-content: space-between;
    border-top: 1px solid #eee;
    padding-top: 20px;
  }
.memories a {
    text-decoration: none;
    color: #000;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    transition: opacity 0.3s;
  }
table {
  margin: 20px auto; /* 20px auto bedzie wysrodkowac */
  caption-side: top; /* {  bottom; umiejscowanie tytułu tabeli } */
  width: 60%;
  border: 1px solid gray;
  border-spacing: 10px;

}
td:nth-child(1) { text-align: left; width: 30%; border-left: 2px solid gray;  } td:nth-child(2) { text-align: left; 
width: 45%; } td:nth-child(3) { text-align: left; width: 25%; border-left: 2px solid gray;}

tr:first-child td:nth-child(1),
tr:first-child td:nth-child(2),
tr:first-child td:nth-child(3) {
    border-top: 2px solid gray;
}

td {
    height: 40px;
}
tbody{
  padding: 10px ;
}

</style> 
</head>
<body>
<h1>HTML Table Gallery</h1>
<h2>Tablica 4</h2>
<table border="1"> 
<caption>Imiona</caption> 
<tr><td>komórka o szerokości 30%</td><td >komórka o szerokości 30%</td><td >komórka o szerokości 30%</td></tr> 
<tr><td>B1</td><td>B2</td><td>B3</td></tr>
<tr><td>C1</td><td>C2</td><td>C3</td></tr> 

</table> 

<div class="memories">
    <a href="table3.html">Previous</a>
    <a href="table5.html">Next</a>
</div>
</body>
