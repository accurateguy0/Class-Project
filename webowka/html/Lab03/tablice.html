<!DOCTYPE html>
<html lang="pl">
<head>
 <meta charset="UTF-8">
<title>Table Gallery</title>
<style>
h1 {
    font-weight: 200;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
 h2 {
    font-weight: 300;
    font-style: italic;
    color: #888;
    margin-bottom: 40px;
  }
.memories {
    position: fixed;
    left: 10%;
    right: 10%;
    margin-top: 60px;
    display: flex;
    justify-content: flex-end;
    border-top: 1px solid #eee;
    padding-top: 20px;
  }
.memories a {
    text-decoration: none;
    color: #000;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    transition: opacity 0.3s;
  }
table {
  margin: 20px auto; /* 20px auto bedzie wysrodkowac */
  border: 3px solid gray;      /* 1px solid gray;  3px dotted #F00; obramowanie calej tabeli } */
  border-collapse: collapse; /* { border-collapse: collapse; włączenie nakładania się na siebie obramowania } */
  caption-side: top; /* {  bottom; umiejscowanie tytułu tabeli } */
  width: 50%;

}
th, td {
    border: 1px solid gray; /* 1px solid green;  3px dashed #F00; obramowanie komórki */
    padding: 10px;   /*    odstęp obramowania komórki od jej zawartości  */
    text-align: center; /*text-align: left; vertical-align: top; wyrównanie zawartości komórki w poziomie (left, center, right, justify) / pionie (top, middle, bottom). */

  }
td:nth-child(1) { text-align: right; width: 50px; } td:nth-child(2) { text-align: left; 
width: 99px; } td:nth-child(3) { text-align: center; width: 75px; } /* Ustalanie stylów CSS do każdego n-tego elementu lub do elementów wybranego typu – służą do 
tego m. in. pseudoklasy :nth-child(wzór), :nth-of-type(wzór). 
Można też ustalać style tylko dla ostatnich elementów ze wzorca. Służą do tego pseudoklasy 
:nth-last-child(wzór), :nth-last-of-type(wzór). */

</style> 
</head>
<body>
<h1>HTML Table Gallery</h1>
<table > 
  <caption>Przykładowa Tabela</caption> 
  <thead> 
    <tr> 
      <th>Numer</th> 
      <th>Imię</th> 
      <th>Nazwisko</th> 
    </tr> 
  </thead> 
  <tbody> 
    <tr> 
      <td>1</td> 
      <td>Jan</td> 
      <td>Kowalski</td> 
    </tr> 
    <tr> 
      <td>2</td> 
      <td>Anna</td> 
      <td>Nowak</td> 
    </tr> 
  </tbody>
  <tfoot> 
  <tr><th colspan="3"> 
  <small>Sporządzono: 2016-09-23</small></th></tr> 
  </tfoot>  
</table>

<div class="memories">
    <a href="table1.html">Next</a>
</div>
</body>
