<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <p id="wynik"></p>

    <script>
      var x = 11;
      var y = 5;
      document.writeln(x+y);
      document.writeln(y-x);
      document.writeln(x%y);
      document.writeln(x>y);
      document.writeln(y<=10);
      document.writeln(!(x>10));
      document.writeln(x!=y);
      document.writeln((x<5)&&(y<5));
      document.writeln((x<5)||(y<5));
      document.writeln(x&y);
      document.writeln(x^y);
      document.writeln(x|y);
      document.writeln("x="+x);
      document.writeln("x*y="+(x*y));
    </script>

</body>
</html>
