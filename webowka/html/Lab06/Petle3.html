<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program 16 - Ciąg liczb</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .wynik { font-weight: bold; color: #2c3e50; word-wrap: break-word; }
    </style>
</head>
<body>

    <h2>Inteligentne Wyliczanie Ciągu</h2>
    <div id="kontener" class="wynik"></div>

    <script>
        for(i=0; i <100;i++){
          if(i%2===0){
            document.write(" " + i);
          }
        }
    </script>

</body>
</html>
