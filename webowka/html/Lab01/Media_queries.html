<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries</title>
    <style>
        @media (max-width: 599px) {
            body {
                background-color: #add8e6; 
            }        }

        
        @media (min-width: 1200px) {
            body {
                font-size: 20px; 
            }
        }

    </style>
</head>
<body>

    <header>
        <h1>Media Queries</h1>
    </header>

    <main>
        <h2>Responsywność</h2>
        <p>Poniżej 600px tło staje się jasnoniebieskie.</p>
        <p>Powyżej 1200px rozmiar czcionki zwiększa się do 20px.</p>
    </main>

    <footer>
        <p>&copy; 2026 Strona Responsywna</p>
    </footer>

</body>
</html>
